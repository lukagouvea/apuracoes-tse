name: inf425-cpu
x-cpu: &cpu
  image: inf425-cpu:torch-2.12.0
  build:
    context: .
    dockerfile: Dockerfile.cpu
  platform: linux/amd64
  runtime: runc
  cpus: 2
  mem_limit: 2g
  memswap_limit: 2g
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /workspace
  environment:
    HOME: /tmp
    MPLCONFIGDIR: /tmp/matplotlib
    PYTHONPATH: /workspace/src
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    CUDA_VISIBLE_DEVICES: "-1"
    NVIDIA_VISIBLE_DEVICES: void
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
  entrypoint: ["/usr/bin/nice", "-n", "10", "/opt/venv/bin/python"]
services:
  tools:
    <<: *cpu
    mem_limit: 6g
    memswap_limit: 8g
    volumes:
      - .:/workspace
      - ${TSE_DATA_ROOT:-/mnt/ssd1tb/inf425-tse}:/data/tse
  experiment:
    <<: *cpu
    volumes:
      - .:/workspace
      - ${TSE_DATA_ROOT:-/mnt/ssd1tb/inf425-tse}:/data/tse:ro
