[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inf425-projecao-eleitoral"
version = "0.1.0"
description = "Comparação de projeções eleitorais com snapshots sem vazamento"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "pandas==3.0.3", "pyarrow==23.0.0", "requests==2.32.5", "pypdf==6.1.3"]

[project.scripts]
projecao = "projecao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
